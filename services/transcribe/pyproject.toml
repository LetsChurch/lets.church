[project]
name = "transcribe"
version = "0.1.0"
description = "Temporal worker for audio transcription with faster-whisper, titanet diarization, and wtpsplit segmentation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "temporalio>=1.8.0",
    "python-dotenv>=1.0.0",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "ctranslate2>=4.4.0,<5",
    "faster-whisper==1.2.1",
    "wtpsplit>=2.0.0",
    "nemo_toolkit[asr]>=2.0.0",
    "scikit-learn>=1.3.0",
    "boto3>=1.26.0",
    "numpy>=1.24.0,<2",
]

# PyTorch wheels: pull from the cu128 index so torch ships kernels for
# Blackwell (sm_120, e.g. RTX 5090). The default PyPI cu121 wheels stop at
# sm_90 and any kernel launch on a 5090 hits "no kernel image is available
# for execution on the device".
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# cu128 only has x86_64 Linux wheels (and pulls triton, which is x86_64-only).
# Apple Silicon dev builds resolve torch from PyPI's arm64 CPU wheel instead,
# which doesn't pull triton — keeping `docker build` working on both archs.
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
]

[tool.pytest.ini_options]
# Tests target the stdlib-only modules (vtt, windowing, segmentation), so they
# import `src.*` without pulling torch/nemo. `pythonpath = ["."]` makes the
# `src` package importable from the project root.
pythonpath = ["."]
testpaths = ["tests"]
