[project]
name = "transcribe"
version = "0.1.0"
description = "Temporal worker for audio transcription with faster-whisper, titanet diarization, and wtpsplit segmentation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "temporalio>=1.8.0",
    "python-dotenv>=1.0.0",
    "torch==2.4.0",
    "torchaudio==2.4.0",
    "ctranslate2>=4.4.0,<5",
    "faster-whisper==1.2.1",
    "wtpsplit>=2.0.0",
    "nemo_toolkit[asr]>=2.0.0",
    "scikit-learn>=1.3.0",
    "boto3>=1.26.0",
    "numpy>=1.24.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
