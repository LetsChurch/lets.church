name: CI

on:
  push:
    paths:
      - "packages/**"
      - "services/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"

jobs:
  check:
    runs-on: depot-ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.4.1"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm -r run check

  check-python:
    runs-on: depot-ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: ruff format --check
        uses: astral-sh/ruff-action@v3
        with:
          src: "services/transcribe"
          args: "format --check"

      - name: ruff check
        uses: astral-sh/ruff-action@v3
        with:
          src: "services/transcribe"

  test-python:
    runs-on: depot-ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Match `services/transcribe/.python-version` and pyproject.toml's
          # `requires-python = ">=3.11,<3.12"`. uv would already resolve this
          # from `.python-version`, but pinning here keeps the CI environment
          # explicit and protects against the working-directory step running
          # before uv resolves the project file.
          python-version: "3.11"

      # Tested modules (vtt, windowing, segmentation) are stdlib-only, so we run
      # in an ephemeral env with just pytest + hypothesis — no torch/nemo install.
      - name: Run python tests
        working-directory: services/transcribe
        run: uv run --no-project --with pytest --with hypothesis pytest

  test:
    runs-on: depot-ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.4.1"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @letschurch/web list @playwright/test --depth=0 --json | jq -r '.[0].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright with dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @letschurch/web exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @letschurch/web exec playwright install-deps chromium

      - name: Run tests
        run: pnpm -r run test

  test-schema-parity:
    runs-on: depot-ubuntu-24.04
    env:
      PARITY_ADMIN_DATABASE_URL: postgres://schema_parity:schema_parity@localhost:5432/schema_parity

    services:
      postgres:
        image: postgres:18.3-alpine3.23
        env:
          POSTGRES_USER: schema_parity
          POSTGRES_PASSWORD: schema_parity
          POSTGRES_DB: schema_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schema_parity -d schema_parity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.4.1"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify fresh and upgraded database parity
        run: pnpm --filter @letschurch/db run test:schema-parity

  test-go:
    runs-on: depot-ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/download/go.mod
          cache-dependency-path: services/download/go.sum

      - name: Run Go tests
        run: GOEXPERIMENT=jsonv2 go test ./...
        working-directory: services/download

  build:
    runs-on: depot-ubuntu-24.04
    needs: [check, check-python, test-python, test, test-schema-parity, test-go]
    if: github.ref == 'refs/heads/kyrios'

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.4.1"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: echo build
