# Production preview overrides
# Use with: docker compose -f docker-compose.yml -f docker-compose.preview.yml up

services:
  # Migration Services
  db-migrate:
    build:
      target: db-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://letschurch:password@postgres:5432/letschurch
    depends_on:
      postgres:
        condition: service_healthy

  elasticsearch-migrate:
    build:
      target: elasticsearch-migrate
    restart: "no"
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Application Services
  web:
    build:
      target: web
    command: null
    volumes: !reset []
    environment:
      NODE_ENV: production
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      elasticsearch-migrate:
        condition: service_completed_successfully

  background-worker:
    build:
      target: background-worker
    command: null
    volumes: !reset []
    environment:
      NODE_ENV: production
      IDENTITY: ${IDENTITY:-preview}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      elasticsearch-migrate:
        condition: service_completed_successfully

  probe-worker:
    build:
      target: probe-worker
    command: null
    volumes: !reset []
    environment:
      NODE_ENV: production
      IDENTITY: ${IDENTITY:-preview}

  transcode-worker:
    build:
      target: transcode-worker
    command: null
    volumes: !reset []
    environment:
      NODE_ENV: production
      IDENTITY: ${IDENTITY:-preview}

  transcribe-worker:
    build:
      target: transcribe-worker
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
    command: null
    volumes: !reset []
    environment:
      NODE_ENV: production
      IDENTITY: ${IDENTITY:-preview}
      WHISPER_MODEL: ${WHISPER_MODEL:-base.en}

  import-worker:
    build:
      target: import-worker
    command: null
    volumes: !reset []
    environment:
      NODE_ENV: production
      IDENTITY: ${IDENTITY:-preview}
