# Production preview overrides
# Use with: docker compose -f docker-compose.yml -f docker-compose.preview.yml up
# (`just preview`, which starts the shared infrastructure first — the migration
# services below can't depend_on postgres/opensearch across compose projects).

services:
  # Migration Services
  db-migrate:
    build:
      target: web
    command: sh -c 'cd /usr/src/app/packages/db && pnpm run db:mark-baseline && pnpm run db:migrate'
    restart: "no"
    environment:
      DATABASE_URL: postgres://letschurch:password@postgres:5432/${LC_PG_DATABASE:-letschurch}

  opensearch-migrate:
    build:
      target: web
    command: sh -c 'cd /usr/src/app/packages/opensearch && pnpm run push-mappings'
    restart: "no"
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX_PREFIX: ${OPENSEARCH_INDEX_PREFIX:-}

  # Application Services
  web:
    build:
      target: web
    command: null
    volumes: !reset []
    environment:
      NODE_ENV: production
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      opensearch-migrate:
        condition: service_completed_successfully

  background-worker:
    build:
      target: background-worker
    command: null
    volumes: !reset []
    environment:
      NODE_ENV: production
      IDENTITY: ${IDENTITY:-preview}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      opensearch-migrate:
        condition: service_completed_successfully

  probe-worker:
    build:
      target: probe-worker
    command: null
    volumes: !reset []
    environment:
      NODE_ENV: production
      IDENTITY: ${IDENTITY:-preview}

  transcode-worker:
    build:
      target: transcode-worker
    command: null
    volumes: !reset []
    environment:
      NODE_ENV: production
      IDENTITY: ${IDENTITY:-preview}

  transcribe-worker:
    build:
      target: transcribe-worker
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
    command: null
    volumes: !reset []
    environment:
      NODE_ENV: production
      IDENTITY: ${IDENTITY:-preview}
      WHISPER_MODEL: ${WHISPER_MODEL:-base.en}

  import-worker:
    build:
      target: import-worker
    command: null
    volumes: !reset []
    environment:
      NODE_ENV: production
      IDENTITY: ${IDENTITY:-preview}
