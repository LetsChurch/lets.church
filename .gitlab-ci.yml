variables:
  GIT_LFS_SKIP_SMUDGE: "1"

.build-changes:
  changes:
    - Dockerfile
    - docker-bake.hcl
    - packages/**/*
    - services/**/*
    - pnpm-lock.yaml
    - pnpm-workspace.yaml

stages:
  - setup
  - verify
  - build
  - deploy
  - notify

#   ____ _   _ _____ ____ _  __
#  / ___| | | | ____/ ___| |/ /
# | |   | |_| |  _|| |   | ' /
# | |___|  _  | |__| |___| . \
#  \____|_| |_|_____\____|_|\_\

check:
  image: node:24.4.1-slim
  stage: verify
  only:
    changes:
      - packages/**/*
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  before_script:
    - corepack enable
  script:
    - pnpm install --frozen-lockfile
    - pnpm -r run check
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

check-python:
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  stage: verify
  only:
    changes:
      - services/transcribe/**/*
  script:
    - uvx ruff format --check services/transcribe
    - uvx ruff check services/transcribe

test-python:
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  stage: verify
  only:
    changes:
      - services/transcribe/**/*
  # Tested modules are stdlib-only — ephemeral pytest + hypothesis env, no torch/nemo.
  script:
    - cd services/transcribe && uv run --no-project --with pytest --with hypothesis pytest

test-go:
  image: golang:1.26-bookworm
  stage: verify
  only:
    changes:
      - services/download/**/*
  script:
    - cd services/download && GOEXPERIMENT=jsonv2 go test ./...

#  _____ _____ ____ _____
# |_   _| ____/ ___|_   _|
#   | | |  _| \___ \ | |
#   | | | |___ ___) || |
#   |_| |_____|____/ |_|

test:
  image: node:24.4.1-slim
  stage: verify
  only:
    changes:
      - packages/**/*
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  variables:
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  before_script:
    - corepack enable
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @letschurch/web exec playwright install --with-deps chromium
    - pnpm -r run test
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - .pnpm-store
    - key:
        files:
          - pnpm-lock.yaml
        prefix: playwright
      paths:
        - .cache/ms-playwright

#  ____  _   _ ___ _     ____
# | __ )| | | |_ _| |   |  _ \
# |  _ \| | | || || |   | | | |
# | |_) | |_| || || |___| |_| |
# |____/ \___/|___|_____|____/

build-all:
  image: docker:24.0.1
  services:
    - docker:24.0.1-dind
  stage: build
  only:
    refs:
      - kyrios
    changes: !reference [.build-changes, changes]
  before_script:
    - apk add --no-cache curl
    - curl https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - TAG=${CI_COMMIT_SHORT_SHA} depot bake -f docker-bake.hcl --push

#  ____             _
# |  _ \  ___ _ __ | | ___  _   _
# | | | |/ _ \ '_ \| |/ _ \| | | |
# | |_| |  __/ |_) | | (_) | |_| |
# |____/ \___| .__/|_|\___/ \__, |
#            |_|            |___/

deploy-manifests:
  image: debian:bookworm-slim
  stage: deploy
  needs:
    - job: build-all
      optional: true
  only:
    refs:
      - kyrios
    changes: !reference [.build-changes, changes]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates tar
    - curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin/
  script:
    - git clone "https://ci:${GIT_PUSH_TOKEN}@gitlab.com/LetsChurch/manifests.git" manifests-repo
    - cd manifests-repo/prod
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/background-worker:$CI_COMMIT_SHORT_SHA
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/download-service:$CI_COMMIT_SHORT_SHA
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/import-worker:$CI_COMMIT_SHORT_SHA
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/probe-worker:$CI_COMMIT_SHORT_SHA
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/transcode-worker:$CI_COMMIT_SHORT_SHA
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/transcribe-worker:$CI_COMMIT_SHORT_SHA
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/web:$CI_COMMIT_SHORT_SHA
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/lets-bible:$CI_COMMIT_SHORT_SHA
    - cd ../tnw
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/import-worker:$CI_COMMIT_SHORT_SHA
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/probe-worker:$CI_COMMIT_SHORT_SHA
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/transcode-worker:$CI_COMMIT_SHORT_SHA
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/transcode-worker-ama:$CI_COMMIT_SHORT_SHA
    - cd ..
    - git config user.email "ci@lets.church"
    - git config user.name "GitLab CI"
    - git add prod/kustomization.yml tnw/kustomization.yml
    - 'git diff --cached --quiet || git commit -m "deploy: $CI_COMMIT_SHORT_SHA"'
    - git push origin main
