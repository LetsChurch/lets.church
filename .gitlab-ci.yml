variables:
  GIT_LFS_SKIP_SMUDGE: "1"

stages:
  - setup
  - verify
  - build
  - deploy
  - notify

#   ____ _   _ _____ ____ _  __
#  / ___| | | | ____/ ___| |/ /
# | |   | |_| |  _|| |   | ' /
# | |___|  _  | |__| |___| . \
#  \____|_| |_|_____\____|_|\_\

check:
  image: node:24.4.1-slim
  stage: verify
  only:
    changes:
      - packages/**/*
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  before_script:
    - corepack enable
  script:
    - pnpm install --frozen-lockfile
    - pnpm -r run check
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

#  _____ _____ ____ _____
# |_   _| ____/ ___|_   _|
#   | | |  _| \___ \ | |
#   | | | |___ ___) || |
#   |_| |_____|____/ |_|

test:
  image: node:24.4.1-slim
  stage: verify
  only:
    changes:
      - packages/**/*
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  before_script:
    - corepack enable
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @letschurch/web exec playwright install --with-deps chromium
    - pnpm -r run test
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - .pnpm-store
    - key: playwright-$CI_COMMIT_REF_SLUG
      paths:
        - /root/.cache/ms-playwright

#  ____  _   _ ___ _     ____
# | __ )| | | |_ _| |   |  _ \
# |  _ \| | | || || |   | | | |
# | |_) | |_| || || |___| |_| |
# |____/ \___/|___|_____|____/

build-all:
  image: docker:24.0.1
  services:
    - docker:24.0.1-dind
  stage: build
  only:
    - kyrios
  before_script:
    - apk add --no-cache curl
    - curl https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - TAG=${CI_COMMIT_SHORT_SHA} depot bake -f docker-bake.hcl --push

#  ____             _
# |  _ \  ___ _ __ | | ___  _   _
# | | | |/ _ \ '_ \| |/ _ \| | | |
# | |_| |  __/ |_) | | (_) | |_| |
# |____/ \___| .__/|_|\___/ \__, |
#            |_|            |___/

deploy-k8s:
  image: ubuntu:24.04
  stage: deploy
  only:
    - kyrios
  before_script:
    - apt-get update && apt-get install -y bsdmainutils curl git git-lfs gnupg just openssl

    # Install kubectl
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/

    # Install kustomize
    - curl -s https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
    - mv kustomize /usr/local/bin/
  script:
    - cd infra/k8s/prod
    - just deploy-set-images prod $CI_COMMIT_SHORT_SHA
    - kubectl apply -k .

# Runs in parallel with deploy-k8s. Once ArgoCD is confirmed stable, remove deploy-k8s.
deploy-manifests:
  image: debian:bookworm-slim
  stage: deploy
  only:
    - kyrios
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates tar
    - curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin/
  script:
    - git clone "https://ci:${GIT_PUSH_TOKEN}@gitlab.com/LetsChurch/manifests.git" manifests-repo
    - cd manifests-repo/prod
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/web:$CI_COMMIT_SHORT_SHA
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/background-worker:$CI_COMMIT_SHORT_SHA
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/import-worker:$CI_COMMIT_SHORT_SHA
    - kustomize edit set image registry.gitlab.com/letschurch/lets.church/transcode-worker:$CI_COMMIT_SHORT_SHA
    - git config user.email "ci@lets.church"
    - git config user.name "GitLab CI"
    - git add kustomization.yml
    - 'git diff --cached --quiet || git commit -m "deploy: $CI_COMMIT_SHORT_SHA"'
    - git push origin main
