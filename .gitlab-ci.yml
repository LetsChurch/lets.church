variables:
  GIT_LFS_SKIP_SMUDGE: "1"

stages:
  - setup
  - check
  - test
  - build
  - deploy
  - notify

#   ____ _   _ _____ ____ _  __
#  / ___| | | | ____/ ___| |/ /
# | |   | |_| |  _|| |   | ' /
# | |___|  _  | |__| |___| . \
#  \____|_| |_|_____\____|_|\_\

check-gateway:
  image: oven/bun:1.2.0-slim
  stage: check
  script:
    - cd $CI_PROJECT_DIR/services/gateway
    - bun install
    - bun run check
  cache:
    key:
      files:
        - $CI_PROJECT_DIR/services/gateway/bun.lock
    paths:
      - $HOME/.bun/install/cache

check-web:
  image: node:23.6.1-bookworm-slim
  stage: check
  script:
    - cd $CI_PROJECT_DIR/apps/web
    - npm ci --cache $CI_PROJECT_DIR/.npm --prefer-offline
    - npm run check
  cache:
    key:
      files:
        - $CI_PROJECT_DIR/apps/web/package-lock.json
    paths:
      - $CI_PROJECT_DIR/.npm

check-web-next:
  image: oven/bun:1.2.0-slim
  stage: check
  script:
    - cd $CI_PROJECT_DIR/apps/web-next
    - bun install
    - bun run check
  cache:
    key:
      files:
        - $CI_PROJECT_DIR/apps/web-next/bun.lockb
    paths:
      - $HOME/.bun/install/cache

check-scripts:
  image: oven/bun:1.2.0-slim
  stage: check
  script:
    - cd $CI_PROJECT_DIR/scripts
    - bun install
    - bun run check
  cache:
    key:
      files:
        - $CI_PROJECT_DIR/scripts/bun.lockb
    paths:
      - $HOME/.bun/install/cache

test-gateway:
  image: oven/bun:1.2.0-slim
  stage: check
  before_script:
    # Install node (required for vitest)
    - apt-get update && apt-get install -y curl
    - curl -sS https://webi.sh/node | sh
    - source $HOME/.config/envman/PATH.env
  script:
    - cd services/gateway
    - bun install
    - npm test
  cache:
    key:
      files:
        - $CI_PROJECT_DIR/services/gateway/bun.lock
    paths:
      - $HOME/.bun/install/cache

