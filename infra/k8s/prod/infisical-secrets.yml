# Secrets synced from Infisical via the Infisical Kubernetes Operator.
#
# Prerequisites:
#   1. Install the Infisical operator (see ../README.md)
#   2. Create the universal auth credentials secret:
#        kubectl create secret generic infisical-universal-auth \
#          --namespace letschurch-prod \
#          --from-literal=clientId=<client-id> \
#          --from-literal=clientSecret=<client-secret>
#
# Infisical project secret path layout (all under environment "prod"):
#   /app/jwt                    -> jwt-secret
#   /app/listmonk               -> listmonk-secret
#   /app/mapbox                 -> mapbox-secret
#   /app/web                    -> web-app-secret
#   /infra/cloudflare           -> cloudflare-secret
#   /infra/imgproxy             -> imgproxy-secret
#   /infra/pgo-backup-creds     -> pgo-backup-creds (key: s3.conf, value: pgBackRest INI config)
#   /infra/s3/backup            -> s3-backup-secret
#   /infra/s3/ingest            -> s3-ingest-secret
#   /infra/s3/public            -> s3-public-secret
#   /infra/smtp                 -> smtp-secret
#   /observability/axiom-pino   -> axiom-pino-secret
#   /observability/sentry       -> sentry-secret
#   /observability/vector       -> vector-secret
---
# Observability
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: axiom-pino-secret-sync
spec:
  hostAPI: KUSTOMIZE_REPLACEMENT
  authentication:
    universalAuth:
      credentialsRef:
        secretName: KUSTOMIZE_REPLACEMENT
        secretNamespace: KUSTOMIZE_REPLACEMENT
      secretsScope:
        projectSlug: KUSTOMIZE_REPLACEMENT
        envSlug: KUSTOMIZE_REPLACEMENT
        secretsPath: /observability/axiom-pino
  managedKubeSecretReferences:
    - secretName: axiom-pino-secret
      secretNamespace: letschurch-prod
      creationPolicy: Owner
      template:
        includeAllSecrets: true
---
