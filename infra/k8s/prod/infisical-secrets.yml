# pgBackRest backup credentials for pgo.
# Store the pgBackRest INI config file content in Infisical at
# /infra/pgo-backup-creds with a single secret key named "s3.conf".
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: pgo-backup-creds-sync
spec:
  hostAPI: KUSTOMIZE_REPLACEMENT
  authentication:
    universalAuth:
      credentialsRef:
        secretName: KUSTOMIZE_REPLACEMENT
        secretNamespace: KUSTOMIZE_REPLACEMENT
      secretsScope:
        projectSlug: KUSTOMIZE_REPLACEMENT
        envSlug: KUSTOMIZE_REPLACEMENT
        secretsPath: /infra/pgo-backup-creds
  managedKubeSecretReferences:
    - secretName: pgo-backup-creds
      secretNamespace: letschurch-prod
      creationPolicy: Owner
      template:
        includeAllSecrets: true
