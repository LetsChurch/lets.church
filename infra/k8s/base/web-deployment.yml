---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      restartPolicy: Always
      initContainers:
        - name: db-migrate
          image: registry.gitlab.com/letschurch/lets.church/web:latest
          command: ["sh", "-c", "cd /usr/src/app/packages/db && pnpm run prisma:migrate:deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pg-pguser-letschurch
                  key: uri
        - name: elasticsearch-migrate
          image: registry.gitlab.com/letschurch/lets.church/web:latest
          command: ["sh", "-c", "cd /usr/src/app/packages/elasticsearch && pnpm run push-mappings"]
          envFrom:
            - configMapRef:
                name: web-config
      containers:
        - image: registry.gitlab.com/letschurch/lets.church/web:latest
          name: web
          ports:
            - containerPort: 3000
          env:
            - name: SERVICE_NAME
              value: web
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pg-pguser-letschurch
                  key: uri
          envFrom:
            - secretRef:
                name: axiom-pino-secret
            - secretRef:
                name: imgproxy-secret
            - secretRef:
                name: jwt-secret
            - secretRef:
                name: listmonk-secret
            - secretRef:
                name: mapbox-secret
            - secretRef:
                name: s3-secret
            - secretRef:
                name: sentry-secret
            - secretRef:
                name: smtp-secret
            - secretRef:
                name: cloudflare-secret
            - configMapRef:
                name: temporal-client-config
            - secretRef:
                name: web-app-secret
            - configMapRef:
                name: web-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  annotations:
    tailscale.com/expose: "true"
spec:
  selector:
    app: web
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-funnel
  annotations:
    tailscale.com/funnel: "true"
spec:
  defaultBackend:
    service:
      name: web
      port:
        number: 80
  ingressClassName: tailscale
  tls:
    - hosts:
        - web-funnel
