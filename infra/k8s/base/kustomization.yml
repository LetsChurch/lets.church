resources:
  - config.yml
  - elasticsearch-deployment.yml
  - imgproxy-deployment.yml
  - kibana-deployment.yml
  - listmonk-deployment.yml
  - metabase-deployment.yml
  - pgweb-deployment.yml
  - temporal-deployment.yml
  - temporal-ui-deployment.yml
  - vector-daemonset.yml
  - web-deployment.yml
  # Workers
  - background-worker-deployment.yml
  - import-worker-deployment.yml
  - transcode-worker-deployment.yml
configMapGenerator:
  - name: web-config
    literals:
      - ELASTICSEARCH_URL="http://elasticsearch:9200"
      - IMGPROXY_URL="http://IMGPROXY_URL"
      - LISTMONK_INTERNAL_URL="http://listmonk"
      - MEDIA_URL="http://MEDIA_URL"
      - WEB_URL="https://lets.church"
      - ZXCVBN_MINIMUM_SCORE="3"
  - name: temporal-server-config
    literals:
      - SKIP_DB_CREATE="true"
      - DB=postgres12_pgx # Database vendor
      - POSTGRES_TLS_ENABLED="true" # Auto-setup schema setup
      - POSTGRES_TLS_DISABLE_HOST_VERIFICATION="true"
      - POSTGRES_TLS_CA_FILE="/etc/temporal/certs/ca.crt"
      - SQL_TLS_ENABLED="true" # Server runtime
      - SQL_HOST_VERIFICATION="false"
      - SQL_CA="/etc/temporal/certs/ca.crt" # CA cert for pgx driver
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/production-sql.yml
      - ENABLE_ES="true"
      - ES_SEEDS=elasticsearch # ElasticSearch host
      - ES_VERSION=v7 # Even though we run v8, temporal only has configuration for v7
  - name: temporal-client-config
    literals:
      - TEMPORAL_ADDRESS=temporal:7233
  - name: temporal-ui-config
    literals:
      - TEMPORAL_UI_PORT=8080
  - name: kibana-config
    literals:
      - ELASTICSEARCH_HOSTS="http://elasticsearch:9200"
  - name: background-worker-config
    literals:
      - TEMPORAL_SHUTDOWN_GRACE_TIME=1m
      - IDENTITY=(CLOUD1)
  - name: import-worker-config
    literals:
      - TEMPORAL_SHUTDOWN_GRACE_TIME=1m
      - IDENTITY=(CLOUD1)
      - MAX_CONCURRENT_ACTIVITY_TASK_EXECUTIONS=2
      - MAX_CONCURRENT_WORKFLOW_TASK_EXECUTIONS=2
  - name: transcode-worker-config
    literals:
      - TEMPORAL_SHUTDOWN_GRACE_TIME=1h
      - MAX_CONCURRENT_ACTIVITY_TASK_EXECUTIONS=1
      - IDENTITY=(CLOUD1)
  - name: probe-worker-config
    literals:
      - TEMPORAL_SHUTDOWN_GRACE_TIME=1m
      - IDENTITY=(CLOUD1)
  - name: transcribe-worker-config
    literals:
      - TEMPORAL_SHUTDOWN_GRACE_TIME=1h
      - IDENTITY=(CLOUD1)
  - name: elasticsearch-config
    literals:
      - cluster.routing.allocation.disk.threshold_enabled="true"
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS="-Xms256m -Xmx256m"
      - xpack.security.enabled="false"
