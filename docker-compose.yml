volumes:
  os-data:
  pg-data:
  pnpm-store:

x-s3-ingest-env: &s3-ingest-env
  S3_INGEST_REGION: ${S3_INGEST_REGION}
  S3_INGEST_ENDPOINT: ${S3_INGEST_ENDPOINT}
  S3_INGEST_BUCKET: ${S3_INGEST_BUCKET}
  S3_INGEST_ACCESS_KEY_ID: ${S3_INGEST_ACCESS_KEY_ID}
  S3_INGEST_SECRET_ACCESS_KEY: ${S3_INGEST_SECRET_ACCESS_KEY}

x-s3-public-env: &s3-public-env
  S3_PUBLIC_REGION: ${S3_PUBLIC_REGION}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
  S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET}
  S3_PUBLIC_ACCESS_KEY_ID: ${S3_PUBLIC_ACCESS_KEY_ID}
  S3_PUBLIC_SECRET_ACCESS_KEY: ${S3_PUBLIC_SECRET_ACCESS_KEY}

x-s3-backup-env: &s3-backup-env
  S3_BACKUP_REGION: ${S3_BACKUP_REGION}
  S3_BACKUP_ENDPOINT: ${S3_BACKUP_ENDPOINT}
  S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET}
  S3_BACKUP_ACCESS_KEY_ID: ${S3_BACKUP_ACCESS_KEY_ID}
  S3_BACKUP_SECRET_ACCESS_KEY: ${S3_BACKUP_SECRET_ACCESS_KEY}

services:
  #
  # App Services
  #
  web:
    build:
      context: .
      target: dev
    command: pnpm --filter @letschurch/web run dev --host
    restart: unless-stopped
    depends_on:
      temporal-namespace-setup:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    ports:
      - 127.0.0.1:${HOST_WEB_PORT}:3000
    environment:
      NODE_ENV: development
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      DATABASE_URL: postgres://letschurch:password@postgres:5432/letschurch
      OPENSEARCH_URL: http://opensearch:9200
      VALKEY_URL: redis://valkey:6379
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_URL: ${HOST_IMGPROXY_URL}
      JWT_SECRET: ${JWT_SECRET}
      LISTMONK_INTERNAL_URL: http://listmonk:9000
      LISTMONK_API_USER: ${LISTMONK_API_USER}
      LISTMONK_API_TOKEN: ${LISTMONK_API_TOKEN}
      MAPBOX_MAP_TOKEN: ${MAPBOX_MAP_TOKEN}
      MAPBOX_SEARCHBOX_TOKEN: ${MAPBOX_SEARCHBOX_TOKEN}
      MEDIA_URL: ${MEDIA_URL}
      DOWNLOAD_URL: ${HOST_DOWNLOAD_URL}
      TEMPORAL_ADDRESS: temporal:7233
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      WEB_URL: ${HOST_WEB_URL}
      ZXCVBN_MINIMUM_SCORE: ${ZXCVBN_MINIMUM_SCORE}
      # Embedded OIDC provider (lets.church as identity provider for first-party
      # satellite sites). Signing key is asymmetric (ES256) and separate from
      # JWT_SECRET. Clients are public (PKCE-only); the SET of clients is declared
      # in code (first-party-only by construction), but each client's redirect/
      # post-logout/scope allowlists are overridable per client via
      # OIDC_CLIENT_<ID>_* env vars. In dev these reuse the client's own URIs so
      # provider and client agree from one source; set real https origins in prod.
      OIDC_ISSUER: ${OIDC_ISSUER:-${HOST_WEB_URL}}
      OIDC_SIGNING_JWK: ${OIDC_SIGNING_JWK}
      OIDC_CLIENT_LETS_BIBLE_REDIRECT_URIS: ${OIDC_LETS_BIBLE_REDIRECT_URI}
      OIDC_CLIENT_LETS_BIBLE_POST_LOGOUT_REDIRECT_URIS: ${OIDC_LETS_BIBLE_POST_LOGOUT_URI}
      # Production LLM calls (search parse/suggest/related, the Q&A agent,
      # query-time embeddings) go direct to OpenAI from this container.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # OpenRouter access for the admin LLM-eval surface
      # (`evaluateLlmModel` tRPC mutation), the content-filter fallback, and
      # dev-only seed bootstrap scripts (`just generate-seed-annotations`) —
      # all execute inside this container.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_SUMMARY_MODEL: ${OPENROUTER_SUMMARY_MODEL:-openai/gpt-5.4-mini}
      OPENROUTER_ANNOTATE_MODEL: ${OPENROUTER_ANNOTATE_MODEL:-openai/gpt-5.4-mini}
      <<: [*s3-ingest-env, *s3-public-env]
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./packages/util:/usr/src/app/packages/util
      - /usr/src/app/packages/util/node_modules
      - ./packages/s3:/usr/src/app/packages/s3
      - /usr/src/app/packages/s3/node_modules
      - ./packages/db:/usr/src/app/packages/db
      - /usr/src/app/packages/db/src/generated
      - /usr/src/app/packages/db/node_modules
      - ./packages/opensearch:/usr/src/app/packages/opensearch
      - /usr/src/app/packages/opensearch/node_modules
      - ./packages/temporal:/usr/src/app/packages/temporal
      - /usr/src/app/packages/temporal/node_modules
      - ./packages/web:/usr/src/app/packages/web
      - /usr/src/app/packages/web/node_modules
      # Seed-data LLM snapshots — read at seed time by dev.ts (the JSONs
      # under seed-data/llm/ aren't S3-synced, they're consumed directly off
      # disk). Also lets `just dump-llm-seed-data` write back into the repo.
      - ./seed-data:/seed-data

  # Example Relying Party that authenticates users against the embedded OIDC
  # provider in `web`. Exposed on host port 4001. Browser-facing OIDC URLs use
  # OIDC_ISSUER (http://localhost:4000); back-channel calls use the internal
  # service URL (http://web:3000).
  lets-bible:
    build:
      context: .
      target: lets-bible-dev
    command: pnpm --filter @letschurch/lets.bible run dev --host
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - 127.0.0.1:${HOST_LETS_BIBLE_PORT}:3000
    environment:
      NODE_ENV: development
      PORT: 3000
      LETS_BIBLE_DATABASE_URL: postgres://letsbible:password@postgres:5432/letsbible
      ELASTICSEARCH_URL: http://elasticsearch:9200
      OIDC_ISSUER: ${OIDC_ISSUER:-${HOST_WEB_URL}}
      OIDC_INTERNAL_URL: http://web:3000
      OIDC_CLIENT_ID: lets.bible
      OIDC_REDIRECT_URI: ${OIDC_LETS_BIBLE_REDIRECT_URI}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_LETS_BIBLE_POST_LOGOUT_URI}
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./packages/lets.bible:/usr/src/app/packages/lets.bible
      - /usr/src/app/packages/lets.bible/node_modules

  # Storybook for the lets.bible component library + design language.
  lets-bible-storybook:
    build:
      context: .
      target: lets-bible-dev
    command: pnpm --filter @letschurch/lets.bible run storybook
    restart: unless-stopped
    ports:
      - 127.0.0.1:${HOST_LETS_BIBLE_STORYBOOK_PORT}:6006
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./packages/lets.bible:/usr/src/app/packages/lets.bible
      - /usr/src/app/packages/lets.bible/node_modules

  background-worker:
    build:
      context: .
      target: dev
    command: pnpm --filter @letschurch/background-worker run dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      SENTRY_DSN: ${SENTRY_BACKGROUND_WORKER_DSN}
      SERVICE_NAME: background-worker
      IDENTITY: dev
      DATABASE_URL: postgres://letschurch:password@postgres:5432/letschurch
      OPENSEARCH_URL: http://opensearch:9200
      LISTMONK_INTERNAL_URL: http://listmonk:9000
      MAPBOX_GEOCODING_TOKEN: ${MAPBOX_GEOCODING_TOKEN}
      SMTP_URL: smtp://mailpit:1025?pool=true
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_SHUTDOWN_GRACE_TIME: 1m
      WEB_URL: ${HOST_WEB_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_SUMMARY_MODEL: ${OPENROUTER_SUMMARY_MODEL:-openai/gpt-5.4-mini}
      OPENROUTER_ANNOTATE_MODEL: ${OPENROUTER_ANNOTATE_MODEL:-openai/gpt-5.4-mini}
      OPENROUTER_ANNOTATE_FALLBACK_MODEL: ${OPENROUTER_ANNOTATE_FALLBACK_MODEL:-anthropic/claude-haiku-4-5}
      OPENROUTER_SUMMARY_FALLBACK_MODEL: ${OPENROUTER_SUMMARY_FALLBACK_MODEL:-anthropic/claude-haiku-4-5}
      <<: [*s3-ingest-env, *s3-public-env, *s3-backup-env]
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./packages/util:/usr/src/app/packages/util
      - /usr/src/app/packages/util/node_modules
      - ./packages/s3:/usr/src/app/packages/s3
      - /usr/src/app/packages/s3/node_modules
      - ./packages/db:/usr/src/app/packages/db
      - /usr/src/app/packages/db/src/generated
      - /usr/src/app/packages/db/node_modules
      - ./packages/opensearch:/usr/src/app/packages/opensearch
      - /usr/src/app/packages/opensearch/node_modules
      - ./packages/temporal:/usr/src/app/packages/temporal
      - /usr/src/app/packages/temporal/node_modules
      - ./packages/background-worker:/usr/src/app/packages/background-worker
      - /usr/src/app/packages/background-worker/node_modules
    depends_on:
      - temporal

  probe-worker:
    build:
      context: .
      target: dev
    command: pnpm --filter @letschurch/probe-worker run dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      SENTRY_DSN: ${SENTRY_TRANSCODE_WORKER_DSN}
      SERVICE_NAME: probe-worker
      IDENTITY: dev
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_SHUTDOWN_GRACE_TIME: 1h
      MAX_CONCURRENT_ACTIVITY_TASK_EXECUTIONS: 5
      <<: *s3-ingest-env
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./packages/util:/usr/src/app/packages/util
      - /usr/src/app/packages/util/node_modules
      - ./packages/s3:/usr/src/app/packages/s3
      - /usr/src/app/packages/s3/node_modules
      - ./packages/db:/usr/src/app/packages/db
      - /usr/src/app/packages/db/src/generated
      - /usr/src/app/packages/db/node_modules
      - ./packages/opensearch:/usr/src/app/packages/opensearch
      - /usr/src/app/packages/opensearch/node_modules
      - ./packages/temporal:/usr/src/app/packages/temporal
      - /usr/src/app/packages/temporal/node_modules
      - ./packages/probe-worker:/usr/src/app/packages/probe-worker
      - /usr/src/app/packages/probe-worker/node_modules
    depends_on:
      - temporal

  transcode-worker:
    build:
      context: .
      target: dev
    command: pnpm --filter @letschurch/transcode-worker run dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      SENTRY_DSN: ${SENTRY_TRANSCODE_WORKER_DSN}
      SERVICE_NAME: transcode-worker
      IDENTITY: dev
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_SHUTDOWN_GRACE_TIME: 1h
      MAX_CONCURRENT_ACTIVITY_TASK_EXECUTIONS: 1
      <<: [*s3-ingest-env, *s3-public-env]
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./packages/util:/usr/src/app/packages/util
      - /usr/src/app/packages/util/node_modules
      - ./packages/s3:/usr/src/app/packages/s3
      - /usr/src/app/packages/s3/node_modules
      - ./packages/db:/usr/src/app/packages/db
      - /usr/src/app/packages/db/src/generated
      - /usr/src/app/packages/db/node_modules
      - ./packages/opensearch:/usr/src/app/packages/opensearch
      - /usr/src/app/packages/opensearch/node_modules
      - ./packages/temporal:/usr/src/app/packages/temporal
      - /usr/src/app/packages/temporal/node_modules
      - ./packages/transcode-worker:/usr/src/app/packages/transcode-worker
      - /usr/src/app/packages/transcode-worker/node_modules
    depends_on:
      - temporal

  download-service:
    build:
      context: .
      target: download-service
    restart: unless-stopped
    ports:
      - 127.0.0.1:${HOST_DOWNLOAD_PORT:-4900}:8080
    environment:
      MEDIA_URL: ${MEDIA_URL}
      JWT_SECRET: ${JWT_SECRET}

  transcribe-worker:
    build:
      context: .
      target: transcribe-worker
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-tiny.en}
    restart: unless-stopped
    environment:
      SENTRY_DSN: ${SENTRY_TRANSCRIBE_WORKER_DSN}
      IDENTITY: dev
      MAX_CONCURRENT_ACTIVITY_TASK_EXECUTIONS: 1
      PARAGRAPH_TARGET_CHARS: ${PARAGRAPH_TARGET_CHARS:-200}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_SHUTDOWN_GRACE_TIME: 1h
      TITANET_MODEL: ${TITANET_MODEL:-nvidia/speakerverification_en_titanet_large}
      TRANSCRIBE_TASK_QUEUE: ${TRANSCRIBE_TASK_QUEUE:-transcribe}
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny.en}
      WTPSPLIT_MODEL: ${WTPSPLIT_MODEL:-sat-12l-sm}
      WTPSPLIT_PARAGRAPH_THRESHOLD: ${WTPSPLIT_PARAGRAPH_THRESHOLD:-0.5}
      WTPSPLIT_SENTENCE_THRESHOLD: ${WTPSPLIT_SENTENCE_THRESHOLD:-0.4}
      <<: [*s3-ingest-env, *s3-public-env]
    volumes:
      - ./services/transcribe/src:/app/src
      # Tooling for `just regenerate-seed-transcript` — bind the scripts and
      # seed-data into the container so the seed-generation CLI can read HLS
      # playlists directly and write transcript.json straight back into the
      # repo's seed-data tree without docker-cp round-trips.
      - ./services/transcribe/scripts:/app/scripts
      - ./seed-data:/seed-data
    depends_on:
      - temporal
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  import-worker:
    build:
      context: .
      target: dev
    command: pnpm --filter @letschurch/import-worker run dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MAX_CONCURRENT_ACTIVITY_TASK_EXECUTIONS: 2
      SENTRY_DSN: ${SENTRY_IMPORT_WORKER_DSN}
      SERVICE_NAME: import-worker
      IDENTITY: dev
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_SHUTDOWN_GRACE_TIME: 1m
      <<: *s3-ingest-env
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./packages/util:/usr/src/app/packages/util
      - /usr/src/app/packages/util/node_modules
      - ./packages/s3:/usr/src/app/packages/s3
      - /usr/src/app/packages/s3/node_modules
      - ./packages/db:/usr/src/app/packages/db
      - /usr/src/app/packages/db/src/generated
      - /usr/src/app/packages/db/node_modules
      - ./packages/opensearch:/usr/src/app/packages/opensearch
      - /usr/src/app/packages/opensearch/node_modules
      - ./packages/temporal:/usr/src/app/packages/temporal
      - /usr/src/app/packages/temporal/node_modules
      - ./packages/import-worker:/usr/src/app/packages/import-worker
      - /usr/src/app/packages/import-worker/node_modules
    depends_on:
      - temporal

  #
  # Vendor Services
  #
  listmonk:
    image: listmonk/listmonk:v5.1.0
    command: [sh, -c, "./listmonk --install --yes && ./listmonk"]
    restart: unless-stopped
    environment:
      LISTMONK_db__host: postgres
      LISTMONK_db__port: 5432
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: listmonk
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_ADMIN_USER: ${LISTMONK_USER}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_PASSWORD}
      TZ: US/Eastern
    ports:
      - "127.0.0.1:${HOST_LISTMONK_PORT}:9000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  imgproxy:
    image: darthsim/imgproxy:v3.21.0
    restart: unless-stopped
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_USE_S3: true
      IMGPROXY_S3_REGION: ${S3_INGEST_REGION}
      IMGPROXY_S3_ENDPOINT: ${S3_INGEST_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${S3_INGEST_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_INGEST_SECRET_ACCESS_KEY}
    ports:
      - 127.0.0.1:${HOST_IMGPROXY_PORT}:8080

  temporal-schema-setup:
    image: temporalio/admin-tools:1.31.0
    environment:
      POSTGRES_SEEDS: postgres
      DB_PORT: 5432
      POSTGRES_USER: temporal
      SQL_PASSWORD: password
      DBNAME: temporal
      ES_SEEDS: opensearch
    command:
      - sh
      - -c
      - |
        retries=0; max_retries=30
        until nc -z $${POSTGRES_SEEDS} $${DB_PORT}; do
          retries=$$((retries + 1))
          if [ "$$retries" -ge "$$max_retries" ]; then
            echo "ERROR: PostgreSQL not reachable after $$((max_retries * 2))s"
            exit 1
          fi
          echo 'Waiting for PostgreSQL...'; sleep 2
        done
        temporal-sql-tool \
          --plugin postgres12_pgx \
          --ep "$${POSTGRES_SEEDS}" \
          -u "$${POSTGRES_USER}" \
          -p "$${DB_PORT}" \
          --db "$${DBNAME}" \
          setup-schema -v 0.0 || true
        temporal-sql-tool \
          --plugin postgres12_pgx \
          --ep "$${POSTGRES_SEEDS}" \
          -u "$${POSTGRES_USER}" \
          -p "$${DB_PORT}" \
          --db "$${DBNAME}" \
          update-schema \
          -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        retries=0
        until wget -qO- http://$${ES_SEEDS}:9200 >/dev/null 2>&1; do
          retries=$$((retries + 1))
          if [ "$$retries" -ge "$$max_retries" ]; then
            echo "ERROR: Elasticsearch not reachable after $$((max_retries * 2))s"
            exit 1
          fi
          echo 'Waiting for Elasticsearch...'; sleep 2
        done
        temporal-elasticsearch-tool --endpoint "http://$${ES_SEEDS}:9200" setup-schema --fail
    depends_on:
      - postgres
      - opensearch

  temporal:
    image: temporalio/server:1.31.0
    restart: unless-stopped
    environment:
      BIND_ON_IP: "0.0.0.0"
      DB: postgres12_pgx
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: password
      DBNAME: temporal
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yml
      ENABLE_ES: true
      ES_SEEDS: opensearch
      ES_VERSION: v7 # Even though we run v8, temporal only has configuration for v7
    ports:
      - 127.0.0.1:${HOST_TEMPORAL_PORT}:7233
    volumes:
      - ./etc/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    depends_on:
      temporal-schema-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  temporal-namespace-setup:
    image: temporalio/admin-tools:1.31.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      ES_SEEDS: opensearch
    command:
      - sh
      - -c
      - |
        until temporal operator cluster health | grep -q SERVING; do echo 'Waiting for Temporal...'; sleep 2; done
        temporal operator namespace create --retention 24h --namespace default 2>/dev/null || true
        printf 'PUT /temporal_visibility_v1_dev HTTP/1.0\r\nHost: '"$${ES_SEEDS}"':9200\r\nContent-Length: 2\r\nContent-Type: application/json\r\n\r\n{}' | nc $${ES_SEEDS} 9200 >/dev/null 2>&1 || true
        until wget -qO- http://$${ES_SEEDS}:9200/temporal_visibility_v1_dev >/dev/null 2>&1; do echo 'Waiting for Temporal visibility index...'; sleep 2; done
        until temporal operator search-attribute list --namespace default >/dev/null 2>&1; do echo 'Waiting for namespace cache...'; sleep 1; done
        temporal operator search-attribute create --namespace default --name UploadId --type Keyword 2>/dev/null || true
        temporal operator search-attribute create --namespace default --name UserId --type Keyword 2>/dev/null || true
        temporal operator search-attribute create --namespace default --name Username --type Keyword 2>/dev/null || true
        temporal operator search-attribute create --namespace default --name ChannelSlug --type Keyword 2>/dev/null || true
        temporal operator search-attribute create --namespace default --name ChannelId --type Keyword 2>/dev/null || true
        temporal operator search-attribute create --namespace default --name ImportSourceId --type Keyword 2>/dev/null || true
    depends_on:
      temporal:
        condition: service_healthy

  temporal-admin-tools:
    image: temporalio/admin-tools:1.31.0
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    stdin_open: true
    tty: true
    depends_on:
      - temporal

  temporal-ui:
    image: temporalio/ui:2.44.1
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - 127.0.0.1:${HOST_TEMPORAL_UI_PORT}:8080
    depends_on:
      - temporal

  #
  # Service Dependencies
  #
  postgres:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    ports:
      - 127.0.0.1:${HOST_PG_PORT}:5432
    volumes:
      - ./etc/postgres-init:/docker-entrypoint-initdb.d
      - pg-data:/var/lib/postgresql
    command:
      [
        "postgres",
        "-c",
        "log_statement=all",
        "-c",
        "log_min_duration_statement=0",
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - 127.0.0.1:${HOST_OPENSEARCH_PORT}:9200
    volumes:
      - os-data:/usr/share/opensearch/data
    healthcheck:
      test: curl -s -f opensearch:9200/_cluster/health >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - 127.0.0.1:${HOST_VALKEY_PORT}:6379
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  #
  # Development
  #
  storybook:
    build:
      context: .
      target: dev
    command: pnpm --filter @letschurch/web run storybook
    restart: unless-stopped
    ports:
      - 127.0.0.1:${HOST_STORYBOOK_PORT}:6006
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./packages/util:/usr/src/app/packages/util
      - /usr/src/app/packages/util/node_modules
      - ./packages/s3:/usr/src/app/packages/s3
      - /usr/src/app/packages/s3/node_modules
      - ./packages/db:/usr/src/app/packages/db
      - /usr/src/app/packages/db/src/generated
      - /usr/src/app/packages/db/node_modules
      - ./packages/opensearch:/usr/src/app/packages/opensearch
      - /usr/src/app/packages/opensearch/node_modules
      - ./packages/temporal:/usr/src/app/packages/temporal
      - /usr/src/app/packages/temporal/node_modules
      - ./packages/web:/usr/src/app/packages/web
      - /usr/src/app/packages/web/node_modules

  mailpit:
    image: axllent/mailpit:v1.13.0
    restart: unless-stopped
    ports:
      - 127.0.0.1:${HOST_MAILPIT_SMTP_PORT}:1025 # smtp server
      - 127.0.0.1:${HOST_MAILPIT_WEB_PORT}:8025 # web ui
