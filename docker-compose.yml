# App services for ONE checkout (the primary one or a `git worktree`). The
# shared infrastructure they talk to — Postgres, OpenSearch, Temporal, Valkey,
# Mailpit, imgproxy, Traefik — lives in docker-compose.infra.yml and is started
# by `just infra-up`. Every checkout's containers join the same `lc-infra`
# network, so service names are NOT unique across stacks: never address another
# app container by its bare service name (`web`); use its per-checkout alias
# (`web.${LC_WT}.internal`). See docs/worktrees.md.
networks:
  default:
    name: lc-infra
    external: true

x-app-env: &app-env
  # Per-checkout isolation on the shared infrastructure, set by .envrc.
  OPENSEARCH_INDEX_PREFIX: ${OPENSEARCH_INDEX_PREFIX:-}
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}

# Storage locations (packages/s3/README.md#storage-locations). Each location id
# pairs an ingest and a public bucket and is discovered from
# STORAGE_<ID>_*_BUCKET key names. `idrive` is the default location; `rustfs`
# is optional and stays ignored while its BUCKET vars are empty.
x-s3-ingest-env: &s3-ingest-env
  STORAGE_IDRIVE_INGEST_REGION: ${STORAGE_IDRIVE_INGEST_REGION}
  STORAGE_IDRIVE_INGEST_ENDPOINT: ${STORAGE_IDRIVE_INGEST_ENDPOINT}
  STORAGE_IDRIVE_INGEST_BUCKET: ${STORAGE_IDRIVE_INGEST_BUCKET}
  STORAGE_IDRIVE_INGEST_ACCESS_KEY_ID: ${STORAGE_IDRIVE_INGEST_ACCESS_KEY_ID}
  STORAGE_IDRIVE_INGEST_SECRET_ACCESS_KEY: ${STORAGE_IDRIVE_INGEST_SECRET_ACCESS_KEY}
  STORAGE_IDRIVE_INGEST_FORCE_PATH_STYLE: ${STORAGE_IDRIVE_INGEST_FORCE_PATH_STYLE:-}
  STORAGE_IDRIVE_INGEST_MAX_BYTES: ${STORAGE_IDRIVE_INGEST_MAX_BYTES:-}
  STORAGE_RUSTFS_INGEST_REGION: ${STORAGE_RUSTFS_INGEST_REGION:-}
  STORAGE_RUSTFS_INGEST_ENDPOINT: ${STORAGE_RUSTFS_INGEST_ENDPOINT:-}
  STORAGE_RUSTFS_INGEST_BUCKET: ${STORAGE_RUSTFS_INGEST_BUCKET:-}
  STORAGE_RUSTFS_INGEST_ACCESS_KEY_ID: ${STORAGE_RUSTFS_INGEST_ACCESS_KEY_ID:-}
  STORAGE_RUSTFS_INGEST_SECRET_ACCESS_KEY: ${STORAGE_RUSTFS_INGEST_SECRET_ACCESS_KEY:-}
  STORAGE_RUSTFS_INGEST_FORCE_PATH_STYLE: ${STORAGE_RUSTFS_INGEST_FORCE_PATH_STYLE:-}
  STORAGE_RUSTFS_INGEST_MAX_BYTES: ${STORAGE_RUSTFS_INGEST_MAX_BYTES:-}

x-s3-public-env: &s3-public-env
  STORAGE_IDRIVE_PUBLIC_REGION: ${STORAGE_IDRIVE_PUBLIC_REGION}
  STORAGE_IDRIVE_PUBLIC_ENDPOINT: ${STORAGE_IDRIVE_PUBLIC_ENDPOINT}
  STORAGE_IDRIVE_PUBLIC_BUCKET: ${STORAGE_IDRIVE_PUBLIC_BUCKET}
  STORAGE_IDRIVE_PUBLIC_ACCESS_KEY_ID: ${STORAGE_IDRIVE_PUBLIC_ACCESS_KEY_ID}
  STORAGE_IDRIVE_PUBLIC_SECRET_ACCESS_KEY: ${STORAGE_IDRIVE_PUBLIC_SECRET_ACCESS_KEY}
  STORAGE_IDRIVE_PUBLIC_FORCE_PATH_STYLE: ${STORAGE_IDRIVE_PUBLIC_FORCE_PATH_STYLE:-}
  STORAGE_IDRIVE_PUBLIC_MAX_BYTES: ${STORAGE_IDRIVE_PUBLIC_MAX_BYTES:-}
  STORAGE_IDRIVE_PUBLIC_URL: ${STORAGE_IDRIVE_PUBLIC_URL}
  STORAGE_RUSTFS_PUBLIC_REGION: ${STORAGE_RUSTFS_PUBLIC_REGION:-}
  STORAGE_RUSTFS_PUBLIC_ENDPOINT: ${STORAGE_RUSTFS_PUBLIC_ENDPOINT:-}
  STORAGE_RUSTFS_PUBLIC_BUCKET: ${STORAGE_RUSTFS_PUBLIC_BUCKET:-}
  STORAGE_RUSTFS_PUBLIC_ACCESS_KEY_ID: ${STORAGE_RUSTFS_PUBLIC_ACCESS_KEY_ID:-}
  STORAGE_RUSTFS_PUBLIC_SECRET_ACCESS_KEY: ${STORAGE_RUSTFS_PUBLIC_SECRET_ACCESS_KEY:-}
  STORAGE_RUSTFS_PUBLIC_FORCE_PATH_STYLE: ${STORAGE_RUSTFS_PUBLIC_FORCE_PATH_STYLE:-}
  STORAGE_RUSTFS_PUBLIC_MAX_BYTES: ${STORAGE_RUSTFS_PUBLIC_MAX_BYTES:-}
  STORAGE_RUSTFS_PUBLIC_URL: ${STORAGE_RUSTFS_PUBLIC_URL:-}

x-s3-backup-env: &s3-backup-env
  S3_BACKUP_REGION: ${S3_BACKUP_REGION}
  S3_BACKUP_ENDPOINT: ${S3_BACKUP_ENDPOINT}
  S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET}
  S3_BACKUP_ACCESS_KEY_ID: ${S3_BACKUP_ACCESS_KEY_ID}
  S3_BACKUP_SECRET_ACCESS_KEY: ${S3_BACKUP_SECRET_ACCESS_KEY}

x-mux-env: &mux-env
  MUX_TOKEN_ID: ${MUX_TOKEN_ID:-}
  MUX_TOKEN_SECRET: ${MUX_TOKEN_SECRET:-}

services:
  #
  # App Services
  #
  web:
    build:
      context: .
      target: dev
    command: pnpm --filter @letschurch/web run dev --host
    restart: unless-stopped
    depends_on:
      temporal-namespace-setup:
        condition: service_completed_successfully
    networks:
      default:
        aliases: ['web.${LC_WT:?run inside direnv}.internal']
    # List form: Compose interpolates label values but not mapping keys, and
    # router names must be unique per checkout.
    labels:
      - traefik.enable=true
      # The web origin plus one level of subdomains under it (published church
      # websites are served on `<slug>.<web host>`).
      - 'traefik.http.routers.${LC_WT}-web.rule=Host(`${LC_WEB_HOST}`) || HostRegexp(`^[a-z0-9-]+\.${LC_WEB_HOST_RE}$$`)'
      - traefik.http.services.${LC_WT}-web.loadbalancer.server.port=3000
    environment:
      NODE_ENV: development
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      DATABASE_URL: postgres://letschurch:password@postgres:5432/${LC_PG_DATABASE:-letschurch}
      OPENSEARCH_URL: http://opensearch:9200
      VALKEY_URL: redis://valkey:6379/${LC_VALKEY_DB:-0}
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_URL: ${HOST_IMGPROXY_URL}
      JWT_SECRET: ${JWT_SECRET}
      PASSWORDLESS_EMAIL_ENCRYPTION_KEY: ${PASSWORDLESS_EMAIL_ENCRYPTION_KEY}
      LISTMONK_INTERNAL_URL: http://listmonk:9000
      LISTMONK_API_USER: ${LISTMONK_API_USER}
      LISTMONK_API_TOKEN: ${LISTMONK_API_TOKEN}
      MAPBOX_MAP_TOKEN: ${MAPBOX_MAP_TOKEN}
      MAPBOX_SEARCHBOX_TOKEN: ${MAPBOX_SEARCHBOX_TOKEN}
      DOWNLOAD_URL: ${HOST_DOWNLOAD_URL}
      TEMPORAL_ADDRESS: temporal:7233
      HCAPTCHA_SITE_KEY: '10000000-ffff-ffff-ffff-000000000001'
      HCAPTCHA_SECRET_KEY: '0x0000000000000000000000000000000000000000'
      WEB_URL: ${HOST_WEB_URL}
      # Base URL for linking scripture refs into lets.bible (Vite inlines VITE_*).
      VITE_LETS_BIBLE_URL: ${VITE_LETS_BIBLE_URL:?set by .envrc}
      ZXCVBN_MINIMUM_SCORE: ${ZXCVBN_MINIMUM_SCORE}
      # Embedded OIDC provider (lets.church as identity provider for first-party
      # satellite sites). Signing key is asymmetric (ES256) and separate from
      # JWT_SECRET. Clients are public (PKCE-only); the SET of clients is declared
      # in code (first-party-only by construction), but each client's redirect/
      # post-logout/scope allowlists are overridable per client via
      # OIDC_CLIENT_<ID>_* env vars. In dev these reuse the client's own URIs so
      # provider and client agree from one source; set real https origins in prod.
      OIDC_ISSUER: ${OIDC_ISSUER:-${HOST_WEB_URL}}
      OIDC_SIGNING_JWK: ${OIDC_SIGNING_JWK}
      OIDC_CLIENT_LETS_BIBLE_REDIRECT_URIS: ${OIDC_LETS_BIBLE_REDIRECT_URI}
      OIDC_CLIENT_LETS_BIBLE_POST_LOGOUT_REDIRECT_URIS: ${OIDC_LETS_BIBLE_POST_LOGOUT_URI}
      # Production LLM calls (search parse/suggest/related, the Q&A agent,
      # query-time embeddings) go direct to OpenAI from this container.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Optional PostHog AI Observability. Content capture defaults off.
      POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      POSTHOG_AI_CAPTURE_CONTENT: ${POSTHOG_AI_CAPTURE_CONTENT:-false}
      # OpenRouter access for the admin LLM-eval surface
      # (`evaluateLlmModel` tRPC mutation), the content-filter fallback, and
      # dev-only seed bootstrap scripts (`just generate-seed-annotations`) —
      # all execute inside this container.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_SUMMARY_MODEL: ${OPENROUTER_SUMMARY_MODEL:-openai/gpt-6-luna}
      OPENROUTER_ANNOTATE_MODEL: ${OPENROUTER_ANNOTATE_MODEL:-openai/gpt-6-luna}
      # Mux live streaming. Webhook secret is the signing secret printed by
      # `mux webhooks listen` (mux-webhooks service) — persists across runs.
      MUX_WEBHOOK_SECRET: ${MUX_WEBHOOK_SECRET:-}
      # Stripe Checkout and webhook signing credentials for donations.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Optional in development; unsigned events are accepted with a warning.
      # Always configure the Workbench endpoint secret in production.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      <<: [*app-env, *s3-ingest-env, *s3-public-env, *s3-backup-env, *mux-env]
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./patches:/usr/src/app/patches:ro
      - ./packages/util:/usr/src/app/packages/util
      - /usr/src/app/packages/util/node_modules
      - ./packages/s3:/usr/src/app/packages/s3
      - /usr/src/app/packages/s3/node_modules
      - ./packages/db:/usr/src/app/packages/db
      - /usr/src/app/packages/db/src/generated
      - /usr/src/app/packages/db/node_modules
      - ./packages/opensearch:/usr/src/app/packages/opensearch
      - /usr/src/app/packages/opensearch/node_modules
      - ./packages/temporal:/usr/src/app/packages/temporal
      - /usr/src/app/packages/temporal/node_modules
      - ./packages/web:/usr/src/app/packages/web
      - /usr/src/app/packages/web/node_modules
      # Seed-data LLM snapshots — read at seed time by dev.ts (the JSONs
      # under seed-data/llm/ aren't S3-synced, they're consumed directly off
      # disk). Also lets `just dump-llm-seed-data` write back into the repo.
      - ./seed-data:/seed-data

  # Example Relying Party that authenticates users against the embedded OIDC
  # provider in `web`. Exposed on host port 4001. Browser-facing OIDC URLs use
  # OIDC_ISSUER (http://localhost:4000); back-channel calls use the internal
  # service URL (http://web:3000).
  letsbible:
    build:
      context: .
      target: letsbible-dev
    command: pnpm --filter @letschurch/lets.bible run dev --host
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.${LC_WT}-letsbible.rule=Host(`${LC_LB_HOST}`)
      - traefik.http.services.${LC_WT}-letsbible.loadbalancer.server.port=3000
    environment:
      NODE_ENV: development
      PORT: 3000
      LETS_BIBLE_DATABASE_URL: postgres://letsbible:password@postgres:5432/${LC_LB_PG_DATABASE:-letsbible}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      POSTHOG_AI_CAPTURE_CONTENT: ${POSTHOG_AI_CAPTURE_CONTENT:-false}
      OPENSEARCH_URL: http://opensearch:9200
      OIDC_ISSUER: ${OIDC_ISSUER:-${HOST_WEB_URL}}
      OIDC_INTERNAL_URL: http://web.${LC_WT:?run inside direnv}.internal:3000
      # Back-channel origin for web's media-for-verse API (the study panel's
      # "Media" tab). Same web service as the OIDC back-channel; kept as its own
      # var so prod can point it independently.
      WEB_INTERNAL_URL: http://web.${LC_WT:?run inside direnv}.internal:3000
      OIDC_CLIENT_ID: lets.bible
      OIDC_REDIRECT_URI: ${OIDC_LETS_BIBLE_REDIRECT_URI}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_LETS_BIBLE_POST_LOGOUT_URI}
      VALKEY_URL: redis://valkey:6379/${LC_VALKEY_DB:-0}
      <<: *app-env
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./packages/lets.bible:/usr/src/app/packages/lets.bible
      - /usr/src/app/packages/lets.bible/node_modules

  # Storybook for the lets.bible component library + design language.
  letsbible-storybook:
    build:
      context: .
      target: letsbible-dev
    command: pnpm --filter @letschurch/lets.bible run storybook
    restart: unless-stopped
    profiles: [storybook]
    labels:
      - traefik.enable=true
      - traefik.http.routers.${LC_WT}-letsbible-storybook.rule=Host(`${LC_WT}.storybook-lb.localhost`)
      - traefik.http.services.${LC_WT}-letsbible-storybook.loadbalancer.server.port=6006
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./packages/lets.bible:/usr/src/app/packages/lets.bible
      - /usr/src/app/packages/lets.bible/node_modules

  background-worker:
    build:
      context: .
      target: dev
    command: pnpm --filter @letschurch/background-worker run dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      SENTRY_DSN: ${SENTRY_BACKGROUND_WORKER_DSN}
      SERVICE_NAME: background-worker
      IDENTITY: dev
      DATABASE_URL: postgres://letschurch:password@postgres:5432/${LC_PG_DATABASE:-letschurch}
      OPENSEARCH_URL: http://opensearch:9200
      LISTMONK_INTERNAL_URL: http://listmonk:9000
      MAPBOX_GEOCODING_TOKEN: ${MAPBOX_GEOCODING_TOKEN}
      SMTP_URL: smtp://mailpit:1025?pool=true
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      PASSWORDLESS_EMAIL_ENCRYPTION_KEY: ${PASSWORDLESS_EMAIL_ENCRYPTION_KEY}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_SHUTDOWN_GRACE_TIME: 1m
      WEB_URL: ${HOST_WEB_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_SUMMARY_MODEL: ${OPENROUTER_SUMMARY_MODEL:-openai/gpt-6-luna}
      OPENROUTER_ANNOTATE_MODEL: ${OPENROUTER_ANNOTATE_MODEL:-openai/gpt-6-luna}
      OPENROUTER_ANNOTATE_FALLBACK_MODEL: ${OPENROUTER_ANNOTATE_FALLBACK_MODEL:-anthropic/claude-haiku-4-5}
      OPENROUTER_SUMMARY_FALLBACK_MODEL: ${OPENROUTER_SUMMARY_FALLBACK_MODEL:-anthropic/claude-haiku-4-5}
      <<: [*app-env, *s3-ingest-env, *s3-public-env, *s3-backup-env, *mux-env]
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./packages/util:/usr/src/app/packages/util
      - /usr/src/app/packages/util/node_modules
      - ./packages/s3:/usr/src/app/packages/s3
      - /usr/src/app/packages/s3/node_modules
      - ./packages/db:/usr/src/app/packages/db
      - /usr/src/app/packages/db/src/generated
      - /usr/src/app/packages/db/node_modules
      - ./packages/opensearch:/usr/src/app/packages/opensearch
      - /usr/src/app/packages/opensearch/node_modules
      - ./packages/temporal:/usr/src/app/packages/temporal
      - /usr/src/app/packages/temporal/node_modules
      - ./packages/background-worker:/usr/src/app/packages/background-worker
      - /usr/src/app/packages/background-worker/node_modules
    depends_on:
      temporal-namespace-setup:
        condition: service_completed_successfully

  probe-worker:
    build:
      context: .
      target: dev
    command: pnpm --filter @letschurch/probe-worker run dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      SENTRY_DSN: ${SENTRY_TRANSCODE_WORKER_DSN}
      SERVICE_NAME: probe-worker
      IDENTITY: dev
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_SHUTDOWN_GRACE_TIME: 1h
      MAX_CONCURRENT_ACTIVITY_TASK_EXECUTIONS: 5
      <<: [*app-env, *s3-ingest-env]
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./packages/util:/usr/src/app/packages/util
      - /usr/src/app/packages/util/node_modules
      - ./packages/s3:/usr/src/app/packages/s3
      - /usr/src/app/packages/s3/node_modules
      - ./packages/db:/usr/src/app/packages/db
      - /usr/src/app/packages/db/src/generated
      - /usr/src/app/packages/db/node_modules
      - ./packages/opensearch:/usr/src/app/packages/opensearch
      - /usr/src/app/packages/opensearch/node_modules
      - ./packages/temporal:/usr/src/app/packages/temporal
      - /usr/src/app/packages/temporal/node_modules
      - ./packages/probe-worker:/usr/src/app/packages/probe-worker
      - /usr/src/app/packages/probe-worker/node_modules
    depends_on:
      temporal-namespace-setup:
        condition: service_completed_successfully

  transcode-worker:
    build:
      context: .
      target: dev
    command: pnpm --filter @letschurch/transcode-worker run dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      SENTRY_DSN: ${SENTRY_TRANSCODE_WORKER_DSN}
      SERVICE_NAME: transcode-worker
      IDENTITY: dev
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_SHUTDOWN_GRACE_TIME: 1h
      MAX_CONCURRENT_ACTIVITY_TASK_EXECUTIONS: 1
      <<: [*app-env, *s3-ingest-env, *s3-public-env]
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./packages/util:/usr/src/app/packages/util
      - /usr/src/app/packages/util/node_modules
      - ./packages/s3:/usr/src/app/packages/s3
      - /usr/src/app/packages/s3/node_modules
      - ./packages/db:/usr/src/app/packages/db
      - /usr/src/app/packages/db/src/generated
      - /usr/src/app/packages/db/node_modules
      - ./packages/opensearch:/usr/src/app/packages/opensearch
      - /usr/src/app/packages/opensearch/node_modules
      - ./packages/temporal:/usr/src/app/packages/temporal
      - /usr/src/app/packages/temporal/node_modules
      - ./packages/transcode-worker:/usr/src/app/packages/transcode-worker
      - /usr/src/app/packages/transcode-worker/node_modules
    depends_on:
      temporal-namespace-setup:
        condition: service_completed_successfully

  transcribe-worker:
    build:
      context: .
      target: transcribe-worker
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-tiny.en}
    restart: unless-stopped
    # Several GB of models; worktrees leave it off by default (COMPOSE_PROFILES).
    profiles: [transcribe]
    environment:
      SENTRY_DSN: ${SENTRY_TRANSCRIBE_WORKER_DSN}
      IDENTITY: dev
      MAX_CONCURRENT_ACTIVITY_TASK_EXECUTIONS: 1
      PARAGRAPH_TARGET_CHARS: ${PARAGRAPH_TARGET_CHARS:-200}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_SHUTDOWN_GRACE_TIME: 1h
      TITANET_MODEL: ${TITANET_MODEL:-nvidia/speakerverification_en_titanet_large}
      TRANSCRIBE_TASK_QUEUE: ${TRANSCRIBE_TASK_QUEUE:-transcribe}
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny.en}
      WTPSPLIT_MODEL: ${WTPSPLIT_MODEL:-sat-12l-sm}
      WTPSPLIT_PARAGRAPH_THRESHOLD: ${WTPSPLIT_PARAGRAPH_THRESHOLD:-0.5}
      WTPSPLIT_SENTENCE_THRESHOLD: ${WTPSPLIT_SENTENCE_THRESHOLD:-0.4}
      <<: [*app-env, *s3-ingest-env, *s3-public-env]
    volumes:
      - ./services/transcribe/src:/app/src
      # Tooling for `just regenerate-seed-transcript` — bind the scripts and
      # seed-data into the container so the seed-generation CLI can read HLS
      # playlists directly and write transcript.json straight back into the
      # repo's seed-data tree without docker-cp round-trips.
      - ./services/transcribe/scripts:/app/scripts
      - ./seed-data:/seed-data
    depends_on:
      temporal-namespace-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  import-worker:
    build:
      context: .
      target: dev
    command: pnpm --filter @letschurch/import-worker run dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MAX_CONCURRENT_ACTIVITY_TASK_EXECUTIONS: 2
      SENTRY_DSN: ${SENTRY_IMPORT_WORKER_DSN}
      SERVICE_NAME: import-worker
      IDENTITY: dev
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_SHUTDOWN_GRACE_TIME: 1m
      <<: [*app-env, *s3-ingest-env, *mux-env]
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./packages/util:/usr/src/app/packages/util
      - /usr/src/app/packages/util/node_modules
      - ./packages/s3:/usr/src/app/packages/s3
      - /usr/src/app/packages/s3/node_modules
      - ./packages/db:/usr/src/app/packages/db
      - /usr/src/app/packages/db/src/generated
      - /usr/src/app/packages/db/node_modules
      - ./packages/opensearch:/usr/src/app/packages/opensearch
      - /usr/src/app/packages/opensearch/node_modules
      - ./packages/temporal:/usr/src/app/packages/temporal
      - /usr/src/app/packages/temporal/node_modules
      - ./packages/import-worker:/usr/src/app/packages/import-worker
      - /usr/src/app/packages/import-worker/node_modules
    depends_on:
      temporal-namespace-setup:
        condition: service_completed_successfully

  # Local-dev Mux webhook forwarder. Logs in with MUX_TOKEN_ID/MUX_TOKEN_SECRET,
  # then runs the Mux CLI's `webhooks listen`, which forwards every webhook for
  # that environment to the web service so you can test the end-to-end flow. The
  # signing secret it uses persists across runs — copy it from the logs into
  # MUX_WEBHOOK_SECRET (web service) only if you want signatures verified. With
  # no/placeholder credentials it idles instead of crash-looping. No public
  # tunnel needed.
  mux-webhooks:
    # glibc base (not alpine): @mux/cli ships per-platform binaries built
    # against glibc, so the musl alpine image fails with ENOENT at runtime.
    image: node:22-slim
    # One webhook forwarder per account is plenty; worktrees leave it off.
    profiles: [webhooks]
    command: >-
      sh -c 'npm install -g @mux/cli &&
      env | grep -E "^MUX_TOKEN_(ID|SECRET)=" > /tmp/mux.env &&
      mux login --env-file /tmp/mux.env &&
      mux webhooks listen --forward-to http://web.${LC_WT:?run inside direnv}.internal:3000/webhooks/mux ||
      (echo "mux-webhooks idle: set real MUX_TOKEN_ID/MUX_TOKEN_SECRET to enable" && sleep 3600)'
    restart: unless-stopped
    environment:
      <<: *mux-env
    depends_on:
      - web

  # Local-dev Stripe webhook forwarder. The --forward-to URL below is a private
  # Docker target, not a URL to enter in Stripe Workbench. The service uses the
  # same test-mode API key as the web service and sends the donation events
  # handled by the application to the web container. Its generated whsec_...
  # value is optional locally: without it, the web service accepts events with
  # a warning instead of verifying their signatures. With no API key this
  # service idles instead of crash-looping. No public tunnel or Dashboard
  # webhook destination is needed locally.
  stripe-webhooks:
    image: stripe/stripe-cli:v1.44.0
    profiles: [webhooks]
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        if [ -z "$$STRIPE_SECRET_KEY" ]; then
          echo "stripe-webhooks idle: set a test-mode STRIPE_SECRET_KEY to enable"
          exec sleep 3600
        fi

        stripe listen \
          --api-key "$$STRIPE_SECRET_KEY" \
          --events checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired,invoice.paid,invoice.payment_failed,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,charge.refunded,charge.dispute.created,charge.dispute.updated,charge.dispute.closed \
          --forward-to http://web.${LC_WT:?run inside direnv}.internal:3000/webhooks/stripe ||
          (echo "stripe-webhooks idle: Stripe CLI listener failed; check STRIPE_SECRET_KEY" && exec sleep 3600)
    restart: unless-stopped
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      - web

  # Creates this checkout's Temporal namespace (TEMPORAL_NAMESPACE) and its
  # custom search attributes on the shared Temporal server. Idempotent.
  temporal-namespace-setup:
    image: temporalio/admin-tools:1.31.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      ES_SEEDS: opensearch
    command:
      - sh
      - -c
      - |
        ns="$${TEMPORAL_NAMESPACE}"
        until temporal operator cluster health | grep -q SERVING; do echo 'Waiting for Temporal...'; sleep 2; done
        temporal operator namespace create --retention 24h --namespace "$$ns" 2>/dev/null || true
        printf 'PUT /temporal_visibility_v1_dev HTTP/1.0\r\nHost: '"$${ES_SEEDS}"':9200\r\nContent-Length: 2\r\nContent-Type: application/json\r\n\r\n{}' | nc $${ES_SEEDS} 9200 >/dev/null 2>&1 || true
        until wget -qO- http://$${ES_SEEDS}:9200/temporal_visibility_v1_dev >/dev/null 2>&1; do echo 'Waiting for Temporal visibility index...'; sleep 2; done
        until temporal operator search-attribute list --namespace "$$ns" >/dev/null 2>&1; do echo 'Waiting for namespace cache...'; sleep 1; done
        for attr in UploadId UserId Username ChannelSlug ChannelId ImportSourceId; do
          temporal operator search-attribute create --namespace "$$ns" --name "$$attr" --type Keyword 2>/dev/null || true
        done

  #
  # Development
  #
  storybook:
    build:
      context: .
      target: dev
    command: pnpm --filter @letschurch/web run storybook
    restart: unless-stopped
    profiles: [storybook]
    labels:
      - traefik.enable=true
      - traefik.http.routers.${LC_WT}-storybook.rule=Host(`${LC_WT}.storybook.localhost`)
      - traefik.http.services.${LC_WT}-storybook.loadbalancer.server.port=6006
    volumes:
      - ./pnpm-workspace.yaml:/usr/src/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/usr/src/app/pnpm-lock.yaml
      - ./packages/util:/usr/src/app/packages/util
      - /usr/src/app/packages/util/node_modules
      - ./packages/s3:/usr/src/app/packages/s3
      - /usr/src/app/packages/s3/node_modules
      - ./packages/db:/usr/src/app/packages/db
      - /usr/src/app/packages/db/src/generated
      - /usr/src/app/packages/db/node_modules
      - ./packages/opensearch:/usr/src/app/packages/opensearch
      - /usr/src/app/packages/opensearch/node_modules
      - ./packages/temporal:/usr/src/app/packages/temporal
      - /usr/src/app/packages/temporal/node_modules
      - ./packages/web:/usr/src/app/packages/web
      - /usr/src/app/packages/web/node_modules
